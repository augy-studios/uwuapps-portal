<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ccffcc" />
  <title>UwU Suite Offline</title>

  <!-- Land the saved theme before first paint. Keep APP_KEY in sync with js/theme.js. -->
  <script>
    (function () {
      var k = "uwusuite";
      var m = "light";
      var c = "classic";
      try {
        m = localStorage.getItem(k + ".mode") || "light";
        c = localStorage.getItem(k + ".colorTheme") || "classic";
      } catch (e) {}
      document.documentElement.setAttribute("data-mode", m);
      document.documentElement.setAttribute("data-color-theme", c);
    })();
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
  <style>
    /* Self-contained: this page is served by the service worker while offline. */

    /* ---- brand colour tokens (7 swatches) ---- */
    :root,
    :root[data-color-theme="classic"] { --brand: #ccffcc; --brand-rgb: 204, 255, 204; --brand-ink-light: #1f6b3d; --brand-ink-dark: #bff5cf; }
    :root[data-color-theme="not-green-1"] { --brand: #ffcccc; --brand-rgb: 255, 204, 204; --brand-ink-light: #8f2d3f; --brand-ink-dark: #f7c3cb; }
    :root[data-color-theme="not-green-2"] { --brand: #ccccff; --brand-rgb: 204, 204, 255; --brand-ink-light: #3a3a8f; --brand-ink-dark: #c9c9f7; }
    :root[data-color-theme="not-green-3"] { --brand: #ffffcc; --brand-rgb: 255, 255, 204; --brand-ink-light: #6b5a12; --brand-ink-dark: #f2ecb8; }
    :root[data-color-theme="not-green-4"] { --brand: #ffccff; --brand-rgb: 255, 204, 255; --brand-ink-light: #7d2c7d; --brand-ink-dark: #f2c3f2; }
    :root[data-color-theme="not-green-5"] { --brand: #ccffff; --brand-rgb: 204, 255, 255; --brand-ink-light: #14646b; --brand-ink-dark: #bdeff5; }
    :root[data-color-theme="really-light-green"] { --brand: #ffffff; --brand-rgb: 255, 255, 255; --brand-ink-light: #333b37; --brand-ink-dark: #e6ece8; }

    /* ---- light / dark surface tokens ---- */
    :root,
    :root[data-mode="light"] {
      --bg: #eef2f0;
      --surface-strong: rgba(255, 255, 255, 0.78);
      --surface-border: rgba(255, 255, 255, 0.65);
      --ink: #121815;
      --muted: #5b665f;
      --brand-ink: var(--brand-ink-light, #1f6b3d);
    }

    :root[data-mode="dark"] {
      --bg: #0c100e;
      --surface-strong: rgba(255, 255, 255, 0.11);
      --surface-border: rgba(255, 255, 255, 0.14);
      --ink: #eef2ef;
      --muted: #9aa7a0;
      --brand-ink: var(--brand-ink-dark, #bff5cf);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Jua", "Segoe UI", sans-serif;
    }

    body {
      background-color: color-mix(in srgb, var(--brand) 10%, var(--bg));
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }

    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 1.5rem; color: var(--brand-ink); }
    p { color: var(--muted); max-width: 320px; line-height: 1.6; }

    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      background: var(--brand-ink);
      color: var(--bg);
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover { transform: translateY(-1px); opacity: 0.9; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <img src="/UUS-192.png" alt="UwU Suite logo" />
  <h1>You're offline</h1>
  <p>UwU Suite needs an internet connection for most features. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
